name: Check bdapps SMS backend

on:
  push:
    paths:
      - 'backend/bdapps/**'
      - '.github/workflows/bdapps-sms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax and simulated SMS flow
        run: |
          php -l backend/bdapps/sms.php
          php backend/bdapps/smoke-test.php
