name: Publish ProshnoLab web preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build website
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          flutter build web --base-href "${PAGES_BASE_PATH%/}/app/"
          mkdir -p dist/app
          cp -a site/. dist/
          cp -a build/web/. dist/app/
          test -s dist/index.html
          test -s dist/app/flutter_bootstrap.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
